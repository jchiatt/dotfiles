# Voxtype — set up to feel like Wispr Flow.
#
# Location: ~/.config/voxtype/config.toml (the whole ~/.config/voxtype dir is a
# symlink into ~/Work/dotfiles, so `voxtype configure` / `config set` edits land
# in the repo). Restart after edits: systemctl --user restart voxtype
#
# Hotkeys live in ~/.config/hypr/bindings.lua:
#   hold Right Alt (where Right Cmd sits)  push-to-talk
#   CTRL + ALT + SUPER + SPACE             hands-free toggle
#
# Dictionary: add words with `voxtype-dict word "Name"`, fix a mishearing with
# `voxtype-dict fix "misheard" "Right"`, or edit the two sections marked
# DICTIONARY below.

# State file for Waybar and `voxtype record toggle`.
state_file = "auto"
engine = "whisper"

[hotkey]
# Hyprland owns the keys (see above), so the evdev hotkey stays off.
enabled = false

[audio]
device = "default"
sample_rate = 16000
# Wispr allows long dictation; 60s cut off long thoughts.
max_duration_secs = 300
pause_media = true

[whisper]
# Options: tiny, base, small, medium, large-v3, large-v3-turbo (+ .en variants)
model = "medium.en"
language = "en"
translate = false
mode = "local"
flash_attention = false
on_demand_loading = false
gpu_isolation = false

# DICTIONARY (vocabulary): names and terms whisper should spell this way.
# Whisper reads this as preceding context, so a natural sentence with correct
# capitalization works best. Keep it under ~150 words or it gets truncated.
initial_prompt = "J.C. Hiatt here, jc@jchiatt.com. Notes on Omarchy, Hyprland, Herdr, tmux, zsh, Claude Code, Codex, rafl, Praxient, Voxtype, Wispr Flow, Syncthing, Tailscale, GitHub, Vercel, and Stratton."

[output]
# type: simulate keystrokes at the cursor (wtype); falls back to clipboard.
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 1
# Space after each dictation so consecutive dictations don't run together.
append_text = " "

# Tidy punctuation left behind by dropped filler words. This is also the hook
# for Wispr-style AI cleanup if you ever want it (any stdin->stdout command).
[output.post_process]
command = "voxtype-tidy"
timeout_ms = 2000

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false

[text]
# Drop "um", "uh", etc. like Wispr does.
filter_filler_words = true
filler_words = ["um", "umm", "uh", "uhh", "er", "erm", "ah", "hmm", "mm"]

# DICTIONARY (replacements): applied after transcription, case-insensitive.
# Left side is what whisper writes; right side is what you want typed.
# Also used for Wispr-style snippets (say the phrase, get the text).
[text.replacements]
# Mishearings
"JC Hyatt" = "J.C. Hiatt"
"J.C. Hyatt" = "J.C. Hiatt"
"Omarchi" = "Omarchy"
"oh marky" = "Omarchy"
"Hyperland" = "Hyprland"
"Herdre" = "Herdr"
"RAFL" = "rafl"
"wispare flow" = "Wispr Flow"
"whisper flow" = "Wispr Flow"
"vox type" = "Voxtype"
"sink thing" = "Syncthing"
"tail scale" = "Tailscale"
# Imported from Wispr Flow (dictionary + snippets)
"btw" = "by the way"
"my email address" = "jc@jchiatt.com"
"my Flow referral" = "Hey, use my referral link to get 1 month off Wispr Flow! https://wisprflow.ai/r?JC1018845"
"organize thoughts prompt" = "Organize these unstructured thoughts into a clear, polished version without adding, removing, or changing meaning. Improve flow and readability while keeping all original ideas intact"
